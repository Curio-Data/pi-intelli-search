name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Select package from release tag
        id: select
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^mcp-v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            echo "package=@curio-data/mcp-intelli-search" >> "$GITHUB_OUTPUT"
            echo "directory=packages/mcp" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^pi-v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            echo "package=@curio-data/pi-intelli-search" >> "$GITHUB_OUTPUT"
            echo "directory=." >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unrecognised release tag '${tag}'. Use 'pi-vX.Y.Z' for the native package or 'mcp-vX.Y.Z' for the MCP package. Historical native tags used the unprefixed 'vX.Y.Z' form (0.14.0 and older) and are not re-released."
            exit 1
          fi
          # npm stage publish inherits publish's guard: a prerelease version
          # without an explicit dist-tag throws. Derive the tag from the
          # version's first prerelease identifier (0.2.0-alpha.0 -> alpha);
          # stable releases use latest.
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            echo "dist_tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag version matches the package manifest
        env:
          TAG_VERSION: ${{ steps.select.outputs.version }}
          PKG_DIR: ${{ steps.select.outputs.directory }}
        run: |
          set -euo pipefail
          manifest_version=$(node -p "require('./${PKG_DIR}/package.json').version")
          if [ "$manifest_version" != "$TAG_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' does not match $PKG_DIR/package.json version '$manifest_version'."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build both artifacts
        run: npm run build:all

      - name: Test native and standalone operations
        run: npm run test:all

      - name: Verify plugin catalogs pin the released MCP version
        if: steps.select.outputs.package == '@curio-data/mcp-intelli-search'
        run: npm run check:plugins

      - name: Stage publish
        working-directory: ${{ steps.select.outputs.directory }}
        env:
          DIST_TAG: ${{ steps.select.outputs.dist_tag }}
        run: npm stage publish --access public --tag "$DIST_TAG"
