name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require an approved branch and successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          # Default: validate MCP's unpublished pin on a release branch and
          # merge after publication. An owner-directed pre-publication merge
          # may mirror main's exact commit to that branch for CI validation.
          # The main registry-pin guard and native publication gate still apply.
          runs=$(gh run list --workflow ci.yml --event push --commit "$sha" --limit 20 \
            --json headBranch,status,conclusion)
          branch=$(printf '%s' "$runs" | jq -r '[.[] | select(.headBranch == "main" or (.headBranch | startswith("release/")))][0] | if .status == "completed" and .conclusion == "success" then .headBranch else empty end')
          test -n "$branch"
          git fetch origin "$branch"
          git merge-base --is-ancestor "$sha" "origin/$branch"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        # Pin to npm 11: the last verified staged publish (v0.14.0) ran on
        # npm 11, and npm's trusted-publishing docs recommend 11.5.1+.
        # npm 12.2 failed the OIDC stage exchange with E401 (2026-10-07);
        # do not track @latest here without a verified staged publish on it.
        run: npm install -g npm@11

      - name: Select package from release tag
        id: select
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^mcp-v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            echo "package=@curio-data/mcp-intelli-search" >> "$GITHUB_OUTPUT"
            echo "directory=packages/mcp" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^dsh-v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            echo "package=@curio-data/dsh-intelli-search" >> "$GITHUB_OUTPUT"
            echo "directory=plugins/dsh" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif [[ "$tag" =~ ^pi-v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            echo "package=@curio-data/pi-intelli-search" >> "$GITHUB_OUTPUT"
            echo "directory=." >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unrecognised release tag '${tag}'. Use 'pi-vX.Y.Z' for the native package, 'mcp-vX.Y.Z' for the MCP package or 'dsh-vX.Y.Z' for the DeepSeek Harness bundle. Historical native tags used the unprefixed 'vX.Y.Z' form (0.14.0 and older) and are not re-released. The first dsh release is a manual bootstrap (see .plan/OPS.md): npm trusted publishing cannot bind before the package exists."
            exit 1
          fi
          # npm stage publish inherits publish's guard: a prerelease version
          # without an explicit dist-tag throws. Derive the tag from the
          # version's first prerelease identifier (0.2.0-alpha.0 -> alpha);
          # stable releases use latest.
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            echo "dist_tag=${prerelease%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag version matches the package manifest
        env:
          TAG_VERSION: ${{ steps.select.outputs.version }}
          PKG_DIR: ${{ steps.select.outputs.directory }}
        run: |
          set -euo pipefail
          manifest_version=$(node -p "require('./${PKG_DIR}/package.json').version")
          if [ "$manifest_version" != "$TAG_VERSION" ]; then
            echo "::error::Tag version '$TAG_VERSION' does not match $PKG_DIR/package.json version '$manifest_version'."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit installed dependencies
        run: npm audit --audit-level=low

      - name: Require matching package minor versions before native staging
        if: steps.select.outputs.package == '@curio-data/pi-intelli-search'
        run: |
          set -euo pipefail
          native=$(node -p "require('./package.json').version")
          mcp=$(node -p "require('./packages/mcp/package.json').version")
          native_core="${native%%-*}"
          mcp_core="${mcp%%-*}"
          test "${native_core%.*}" = "${mcp_core%.*}"
          # Both packages are tagged from one release-branch commit and staged
          # together, so the MCP version need not be published yet: the native
          # tarball never launches the MCP package. The registry-pin plugin
          # check runs after both are published, and ci.yml's catalogue-pin
          # guard keeps an unpublished pin off main.

      - name: Require the exact published MCP version before dsh staging
        # MCP-before-dsh ordering: the dsh launcher pins the exact MCP
        # version, so a dsh bundle must never stage while its pin is
        # unavailable. For a core release, create and publish the MCP release
        # first and wait for this registry check; the native package never
        # launches the dsh bundle and does not wait for it.
        if: steps.select.outputs.package == '@curio-data/dsh-intelli-search'
        env:
          TAG_VERSION: ${{ steps.select.outputs.version }}
        run: |
          set -euo pipefail
          mcp_manifest=$(node -p "require('./packages/mcp/package.json').version")
          test "$mcp_manifest" = "$TAG_VERSION"
          test "$(npm view "@curio-data/mcp-intelli-search@${TAG_VERSION}" version)" = "$TAG_VERSION"
          # Run outside the checkout: npm must resolve the published CLI, not the workspace bin.
          probe=$(mktemp -d "${RUNNER_TEMP}/dsh-pin.XXXXXXXX")
          mkdir "$probe/project"
          cd "$probe"
          HOME="$probe" XDG_CONFIG_HOME="$probe/config" npm_config_cache="$probe/npm" \
            npm exec --yes --package="@curio-data/mcp-intelli-search@${TAG_VERSION}" -- \
            mcp-intelli-search --host dsh --workspace "$probe/project" --check-config

      - name: Build both artifacts
        run: npm run build:all

      - name: Test native and standalone operations
        run: npm run test:all

      - name: Verify generated artifacts and compatibility types
        run: |
          npm run check:toc
          npm run check:plugins
          npm run check:readmes
          npm run check:changelog
          node_modules/.bin/tsc -p test/tsconfig.native-contract.json

      - name: Verify both independent tarball installs
        run: |
          npm run test:mcp:install
          ./test/run-e2e-publish-local.sh

      - name: Verify the dsh bundle pack inventory
        run: |
          set -euo pipefail
          cd plugins/dsh
          npm pack --dry-run --json --ignore-scripts > "${RUNNER_TEMP}/dsh-pack.json"
          jq -e '.[0].files | map(.path) | (any(startswith("vendor")) | not) and (any(. == "cordis.patch.yml")) and (any(. == "LICENSE")) and (any(. == "skills/intelli-search/SKILL.md"))' "${RUNNER_TEMP}/dsh-pack.json" >/dev/null

      - name: Stage publish
        working-directory: ${{ steps.select.outputs.directory }}
        env:
          DIST_TAG: ${{ steps.select.outputs.dist_tag }}
        run: npm stage publish --access public --tag "$DIST_TAG"
