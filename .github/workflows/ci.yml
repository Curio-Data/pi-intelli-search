name: CI

on:
  push:
    branches: [main, plan/mcp-intelli-search]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 is the standalone package's engines floor; release.yml
          # builds and stages on Node 24. The divergence is deliberate.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint markdown for em-dashes
        run: |
          # Enforce AGENTS.md Rule 1: no typographic em-dashes (U+2014).
          # AGENTS.md is excluded because it must contain the character to illustrate the rule.
          violations=$(grep -RPn $'—' --include='*.md' --exclude-dir=node_modules . | grep -Ev '^(\./)?AGENTS\.md:' || true)
          if [ -n "$violations" ]; then
            echo "::error::Em-dash (U+2014) found. See AGENTS.md Rule 1."
            echo "$violations"
            exit 1
          fi

      - name: Build and type-check both artifacts
        run: npm run build:all

      - name: Test native and standalone operations
        run: npm run test:all

      - name: Type-check native compatibility tests
        run: node_modules/.bin/tsc -p test/tsconfig.native-contract.json

      - name: Verify generated README contents match the generator
        run: npm run check:toc

      - name: Verify generated plugin bundles match the generator
        run: npm run check:plugins

      - name: Verify package READMEs match the root README
        run: npm run check:readmes

      - name: Install standalone tarball and exercise native fetch assets
        run: npm run test:mcp:install

      - name: Verify package tarball
        run: npm pack --dry-run

      - name: Install-fresh smoke test (peer-dep drift guard)
        run: ./test/run-e2e-publish-local.sh
        env:
          TMPDIR: ${{ runner.temp }}
